<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поштові відправлення</title>
  <link rel="stylesheet" href="/practicals.css">
</head>
<body>
<main>
  <header><h1>Поштові відправлення</h1></header>
  <section>
    <h2>Список відправлень</h2>

    <p id="status" role="status"></p>
    <div class="table-wrap">
      <table>
        <thead id="table-header"><tr>
          <th>Вміст</th>
          <th>Звідки</th>
          <th>Куди</th>
          <th>Тип доставки</th>
          <th>Вага, кг</th>
          <th>Ширина, см</th>
          <th>Висота, см</th>
          <th>Глибина, см</th>
          <th>Оголошена вартість, грн</th>
          <th>Ціна доставки, грн</th>
        </tr></thead>
        <tbody id="postings"></tbody>
      </table>
    </div>
  </section>
</main>
<script type="module" src="baseline.js"></script>
</body>
</html>
