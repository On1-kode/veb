<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поштові відправлення</title>
  <link rel="stylesheet" href="/practicals.css">
</head>
<body>
<main>
  <header><h1>Поштові відправлення</h1></header>
  <section>
    <h2>Список відправлень</h2>
    <p><a href="edit.html">Додати відправлення</a> · <button class="secondary" id="reload" type="button">Оновити</button></p>
    <p id="status" role="status"></p>
    <div class="table-wrap">
      <table>
        <thead id="table-header"><tr>
          <th x-column="deliveryType">Тип доставки</th>
          <th x-column="content">Вміст</th>
          <th x-column="from">Звідки</th>
          <th x-column="to">Куди</th>
          <th x-column="weight">Вага, кг</th>
          <th x-column="width">Ширина, см</th>
          <th x-column="depth">Глибина, см</th>
          <th x-column="value">Оголошена вартість, грн</th>
          <th x-column="price">Ціна доставки, грн</th>
          <th>Дії</th>
        </tr></thead>
        <tbody id="postings"></tbody>
      </table>
    </div>
  </section>
</main>
<script type="module" src="list.js"></script>
</body>
</html>
